<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Checker</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />

    <!-- Custom styles -->
    <style>
      body {
        background-color: #1e1e2f;
        color: #ffffff;
        font-family: 'Segoe UI', sans-serif;
        text-align: center;
        padding: 30px 20px;
        width: 300px;
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 20px;
        color: #FFF;
      }

      #start {
        margin-top: 20px;
        font-size: 1.2rem;
      }

      .circle-score {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 6px solid #4fe3c1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        font-weight: bold;
        margin: 30px auto 10px;
      }

      .circle-score.good {
        border-color: #28a745;
        color: #28a745;
      }

      .circle-score.bad {
        border-color: #dc3545;
        color: #dc3545;
      }

      .icon-spin {
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <h1 >Email Checker</h1>
    <button id="start" class="btn btn-outline-info">
      <i class="bi bi-play-fill" id="start-icon"></i>
      <span id="start-text">Check</span>
    </button>

    <div id="result-container" class="mt-4" style="display: none;">
      <div id="circle-score" class="circle-score">0%</div>
      <div id="result-label">Loading...</div>
    </div>

    <div id="info-container" style="display: none;" class="mt-3">
      <a href="details.html" target="_blank" class="btn btn-sm btn-outline-warning">
        <i class="bi bi-info-circle"></i> Why this result?
      </a>
    </div>

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />

    <script src="popup.js"></script>
  </body>
</html>
